version: "3.8"

services:
#docker config of nginx
  nginx:
    build:
      context: ./nginx
    container_name: "nginx_cont"
    ports:
      - "80:80"
    restart: always
    depends_on:
      - django
    networks:
      - notes-app
#docker config of mysql
  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    restart: always
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
       - notes-app
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


#docker config of backend
  django:
    build:
      context:  .
    container_name: django_cont
    #command for the container (to serve backend on the port)
    command: sh -c "python manage.py migrate --no-input && gunicorn notesapp.wsgi --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    #ENV file for Database connection
    env_file:
      - ".env"
    restart: always
    networks:
      - notes-app
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
# initializing volumes and networks
networks:
  notes-app: